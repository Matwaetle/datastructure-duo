<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>자료구조 활동지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="assets/duo.css">
<style>
body { margin: 0; background: var(--duo-bg); color: var(--duo-ink); font: 16px/1.6 var(--f-body); }
.home { max-width: 560px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) 80px max(16px, env(safe-area-inset-left,0px)); }
.home h1 { font: 900 28px var(--f-round); margin: 0 0 4px; }
.home > p { color: var(--duo-mute); margin: 0 0 24px; }
.unit { border-radius: 18px; padding: 16px 20px; color: #fff; margin: 32px 0 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  box-shadow: 0 4px 0 rgba(0,0,0,.18); }
.unit b { font: 900 20px var(--f-round); display: block; } .unit span { font: 700 14px var(--f-round); opacity: .9; }
.u11 { background: var(--duo-green); } .u12 { background: #ce82ff; } .u13 { background: var(--duo-blue); }
.path { list-style: none; margin: 0; padding: 0; display: grid; gap: 22px; justify-items: center; }
.path li { display: grid; justify-items: center; gap: 6px; text-align: center; }
.path li:nth-child(4n+2) { transform: translateX(-60px); } .path li:nth-child(4n+4) { transform: translateX(60px); }
.node { width: 78px; height: 72px; border-radius: 50%; display: grid; place-items: center; text-decoration: none; position: relative;
  background: var(--c); box-shadow: 0 7px 0 var(--cd); font: 900 26px var(--f-round); color: #fff; transition: transform .1s; }
.node:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--cd); }
.node.todo { background: var(--cs); box-shadow: 0 7px 0 var(--cd); color: var(--c); }
/* 종류별: 탐구 활동지(연습·제출 안 함)는 동그라미·초록, 실습 코드(제출)는 네모·보라, 형성평가(제출)는 별 모양 노랑 */
.k-wb { --c: var(--duo-green); --cd: var(--duo-green-d); --cs: #e5f9d4; }
.k-code { --c: #9b59e8; --cd: #7a3fc4; --cs: #f1e6ff; }
.k-form { --c: #ffb800; --cd: #d99a00; --cs: #fff4cc; }
.k-code .node { border-radius: 22px; }
.k-form .node { border-radius: 50% 50% 22px 22px; }
.tag { display: inline-block; font: 900 11px var(--f-round); letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; }
.tag.sub { color: #fff; background: #ff4b4b; }
.tag.prac { color: var(--duo-green-d); background: #e5f9d4; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font: 800 13px var(--f-round); color: var(--duo-mute); margin: -10px 0 8px; }
.legend i { display: inline-block; width: 16px; height: 16px; margin-right: 6px; vertical-align: -3px; background: var(--c); }
.legend .k-wb i { border-radius: 50%; } .legend .k-code i { border-radius: 5px; } .legend .k-form i { border-radius: 50% 50% 4px 4px; }
.node svg { position: absolute; inset: -8px; width: calc(100% + 16px); height: calc(100% + 16px); transform: rotate(-90deg); }
.node svg circle { fill: none; stroke-width: 6; stroke-linecap: round; }
.path .t { font: 800 15px var(--f-round); color: var(--duo-ink); max-width: 260px; }
.path .s { font: 700 13px var(--f-round); color: var(--duo-mute); }
.u11w { --c: var(--duo-green); --cd: var(--duo-green-d); } .u12w { --c: #ce82ff; --cd: #a568cc; } .u13w { --c: var(--duo-blue); --cd: var(--duo-blue-d); }
</style>
</head>
<body>
<main class="home">
  <h1>자료구조 활동지</h1>
  <p>탐구 활동지는 연습용이며 제출하지 않습니다. 실습 코드와 형성평가는 제출 파일(JSON)로 제출합니다.</p>
  <div class="legend"><span class="k-wb"><i></i>탐구 활동지 · 연습</span><span class="k-code"><i></i>실습 코드 · 제출</span><span class="k-form"><i></i>형성평가 · 제출</span></div>
  <div id="units"></div>
</main>
<script>
var CATALOG = [{"week": 11, "files": [{"file": "student_workbook.html", "title": "11주차 탐구 활동지 1부 — 이웃으로 계속 나아가며 돌아보기 (A1~A5)", "keys": 74}, {"file": "student_code_lab.html", "title": "11주차 실습 코드 1부 — 그래프와 격자 미로", "keys": 2}, {"file": "student_workbook_part2.html", "title": "11주차 탐구 활동지 2부 — 코드 실습 기록 (A6~A9)", "keys": 56}, {"file": "student_code_lab_part2.html", "title": "11주차 실습 코드 2부 — 함정 탐색과 같은 미로 비교", "keys": 12}, {"file": "student_workbook_part3.html", "title": "11주차 탐구 활동지 3부 — 섬의 개수, 일반화, 전이 (A10~A15)", "keys": 32}, {"file": "student_code_lab_part3.html", "title": "11주차 실습 코드 3부 — 섬의 개수, 과제 점검", "keys": 5}, {"file": "formative_check.html", "title": "11주차 형성평가 — BFS와 DFS 구별", "keys": 23}]}, {"week": 12, "files": [{"file": "student_workbook.html", "title": "12주차 탐구 활동지 1부 — 몇 번 만에 찾을까, 그리고 어떻게 줄 세울까 (A1~A6)", "keys": 219}, {"file": "student_code_lab.html", "title": "12주차 실습 코드 1부 — 후보 범위 [lo, hi)로 경계 찾기", "keys": 2}, {"file": "student_workbook_part2.html", "title": "12주차 탐구 활동지 2부 — 경계 찾기와 함정 (A7~A10)", "keys": 84}, {"file": "student_code_lab_part2.html", "title": "12주차 실습 코드 2부 — 모듈 bisect와 구간 개수", "keys": 3}, {"file": "student_code_lab_part3.html", "title": "12주차 실습 코드 3부 — 함정 탐색 T1~T4", "keys": 4}, {"file": "student_workbook_part3.html", "title": "12주차 탐구 활동지 3부 — 측정하고, 문장으로 정리하고, 점검하기 (A11~A16)", "keys": 84}, {"file": "student_code_lab_part4.html", "title": "12주차 실습 코드 4부 — 두 정렬의 비교 횟수와 과제 마무리", "keys": 7}, {"file": "formative_check.html", "title": "12주차 형성평가 — 이진 탐색과 경계로 개수 구하기", "keys": 24}]}, {"week": 13, "files": [{"file": "student_workbook.html", "title": "13주차 탐구 활동지 1부 — 같은 계산을 몇 번 하나, 가장 큰 동전부터 고르면 늘 최선인가 (A1~A6)", "keys": 204}, {"file": "student_code_lab.html", "title": "13주차 실습 코드 1부 — 같은 값을 구하는 세 가지 방식", "keys": 1}, {"file": "student_workbook_part2.html", "title": "13주차 탐구 활동지 2부 — 코드 실습 기록 (A7~A10)", "keys": 64}, {"file": "student_code_lab_part2.html", "title": "13주차 실습 코드 2부 — 거스름돈 두 방법과 반례 탐색기", "keys": 3}, {"file": "student_code_lab_part3.html", "title": "13주차 실습 코드 3부 — 예측하고 실행하는 함정 코드 T1~T4", "keys": 6}, {"file": "student_workbook_part3.html", "title": "13주차 탐구 활동지 3부 — 설계, 일반화, 점검 (A11·A12·A13·A14·A16)", "keys": 107}, {"file": "student_code_lab_part4.html", "title": "13주차 실습 코드 4부 — 2차원 DP, 과제 작성 칸, A14 점검", "keys": 9}, {"file": "formative_check.html", "title": "13주차 형성평가 — Greedy와 DP의 차이를 반례로 증명하기", "keys": 37}]}];
var KIND = { workbook: "탐구 활동지", code_lab: "실습 코드", formative: "형성평가" };
function kindOf(f) {
  var part = (f.match(/part(\d)/) || [, "1"])[1];
  if (f.indexOf("formative") === 0) return { k: "형성평가", icon: "★", cls: "k-form", sub: true };
  if (f.indexOf("code_lab") >= 0) return { k: "실습 코드 " + part + "부", icon: "</>", cls: "k-code", sub: true };
  return { k: "탐구 활동지 " + part + "부", icon: "✎", cls: "k-wb", sub: false };
}
function prog(w, f) { try { return JSON.parse(localStorage.getItem("duo:prog:week" + w + "/" + f)) || null; } catch (e) { return null; } }
var out = "";
CATALOG.forEach(function (u) {
  var done = 0;
  var items = u.files.map(function (it) {
    var p = prog(u.week, it.file), ratio = p && p.total ? p.filled / p.total : 0;
    if (ratio >= .95) done++;
    var k = kindOf(it.file), circ = 2 * Math.PI * 46;
    return '<li class="' + k.cls + '"><a class="node ' + (p ? "" : "todo") + '" href="week' + u.week + "/" + it.file + '" aria-label="' + k.k + '">' +
      (p ? '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" stroke="var(--duo-line)"/><circle cx="50" cy="50" r="46" stroke="var(--duo-gold)" stroke-dasharray="' + (circ * ratio) + " " + circ + '"/></svg>' : "") +
      "<span>" + k.icon.replace("<", "&lt;") + "</span></a>" +
      '<span class="t">' + k.k + (k.sub ? '<span class="tag sub">제출</span>' : '<span class="tag prac">연습</span>') + '</span><span class="s">' + it.title.replace(/^\d+주차\s*/, "").replace(/</g, "&lt;") + (p ? " · " + p.filled + "/" + p.total + "칸" : "") + "</span></li>";
  }).join("");
  out += '<section id="week' + u.week + '" class="u' + u.week + 'w"><div class="unit u' + u.week + '"><div><b>' + u.week + '주차</b><span>' + u.files.length + "개 활동 중 " + done + "개 완료</span></div></div>" +
    '<ol class="path">' + items + "</ol></section>";
});
document.getElementById("units").innerHTML = out;
if (location.hash) { var t = document.querySelector(location.hash); if (t) t.scrollIntoView(); }
</script>
</body>
</html>
